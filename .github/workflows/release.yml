name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Read VERSION file
        id: version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Build binary
        run: |
          go build -ldflags "-H=windowsgui -s -w -X main.Version=${{ steps.version.outputs.VERSION }}" -o ssh_proxy.exe main.go

      - name: Create archive
        run: |
          mkdir dist
          7z a -tzip -mx=9 "dist/ssh_proxy-v${{ steps.version.outputs.VERSION }}-windows-amd64.zip" ssh_proxy.exe

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/ssh_proxy-v${{ steps.version.outputs.VERSION }}-windows-amd64.zip
          name: ${{ steps.version.outputs.VERSION }}
          body: |
            Release version ${{ steps.version.outputs.VERSION }}
            
            ## Changes
            - Automated build via GitHub Actions
            
            ## Installation
            1. Download `ssh_proxy-v${{ steps.version.outputs.VERSION }}-windows-amd64.zip`
            2. Extract `ssh_proxy.exe`
            3. Run the application
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
